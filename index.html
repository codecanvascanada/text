<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전체화면 전광판</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: black; color: white;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden; cursor: none;
        }

        body.show-cursor { cursor: default; }

        #controls {
            position: fixed;
            top: 10%; left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            background: rgba(40, 40, 40, 0.95);
            padding: 25px; border-radius: 20px;
            transition: opacity 0.5s ease; /* 좀 더 빠르게 사라지게 수정 */
            width: 85%; max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        #controls.hidden { opacity: 0; pointer-events: none; }

        input[type="text"] {
            width: 100%; padding: 15px;
            font-size: 1.2rem; border-radius: 10px;
            border: none; background: #222; color: white;
            box-sizing: border-box;
        }

        .setting-group {
            display: flex; width: 100%;
            justify-content: space-around; align-items: center;
            font-size: 1.1rem;
        }

        .btn-group { display: flex; gap: 10px; width: 100%; }

        button {
            flex: 1; padding: 15px;
            font-size: 1.1rem; cursor: pointer;
            border-radius: 10px; border: none;
            background: #e84118; color: white; font-weight: bold;
        }

        #display-container {
            width: 100vw; height: 100vh;
            display: flex; align-items: center;
            overflow: hidden; position: relative;
        }

        #scrolling-text {
            white-space: nowrap;
            font-weight: 900;
            line-height: 1;
            position: absolute;
            left: 0;
            display: inline-block;
            will-change: transform;
        }

        @keyframes scrollAnim {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="show-cursor" onclick="showControls()">

    <div id="controls">
        <input type="text" id="userInput" placeholder="문구를 입력하세요" id="mainInput">
        
        <div class="setting-group">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="scrollCheck" checked style="width: 25px; height: 25px;"> 스크롤
            </label>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>크기</span>
                <input type="range" id="sizeSlider" min="5" max="100" value="60">
            </div>
        </div>

        <div class="btn-group">
            <button onclick="runDisplay(event)">실행하기</button>
            <button onclick="toggleFullScreen(event)" style="background:#2f3640;">전체화면</button>
        </div>
    </div>

    <div id="display-container">
        <div id="scrolling-text">입력 후 실행하세요</div>
    </div>

    <script>
        const controls = document.getElementById('controls');
        const textElement = document.getElementById('scrolling-text');
        const userInput = document.getElementById('userInput');
        const body = document.body;
        let hideTimeout;

        function hideControls() {
            controls.classList.add('hidden');
            body.classList.remove('show-cursor');
            userInput.blur(); // 입력창 포커스 해제 (키패드 닫기)
        }

        function showControls() {
            controls.classList.remove('hidden');
            body.classList.add('show-cursor');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(hideControls, 3000); // 3초 후 자동 숨김
        }

        function runDisplay(e) {
            if(e) e.stopPropagation();
            const input = userInput.value;
            if(!input) return;

            textElement.innerText = input;
            textElement.style.fontSize = document.getElementById('sizeSlider').value + "vh";
            
            textElement.style.animation = 'none';
            void textElement.offsetWidth; 

            if (document.getElementById('scrollCheck').checked) {
                textElement.parentElement.style.justifyContent = 'flex-start';
                const duration = Math.max(5, input.length * 0.5 + 5); 
                textElement.style.animation = `scrollAnim ${duration}s linear infinite`;
            } else {
                textElement.parentElement.style.justifyContent = 'center';
                textElement.style.position = 'relative';
                textElement.style.transform = 'none';
            }
            
            hideControls();
        }

        // 전체화면 토글 로직 수정
        function toggleFullScreen(e) {
            if(e) e.stopPropagation();
            const docEl = document.documentElement;

            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                if(requestFS) requestFS.call(docEl);
            } else {
                const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if(exitFS) exitFS.call(document);
            }

            // 전체화면 전환 시점에 즉시 숨김 처리
            hideControls();
        }

        // 이벤트 리스너들
        document.addEventListener('mousemove', (e) => {
            // 마우스가 상단 컨트롤 영역에 없을 때만 자동숨김 타이머 작동
            showControls();
        });

        document.addEventListener('touchstart', showControls);
        
        document.addEventListener('keydown', (e) => { 
            showControls();
            if (e.key === "Escape") {
                // ESC 누르면 전체화면 해제는 브라우저 기본 기능이므로 컨트롤만 보여줌
                showControls();
            }
        });

        // 초기 설정
        showControls();
    </script>
</body>
</html>
