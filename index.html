<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 전광판</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: black; color: white;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden; cursor: none;
        }

        body.show-cursor { cursor: default; }

        /* 컨트롤 패널: 모바일에서 더 크게 보이도록 수정 */
        #controls {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column; /* 세로 배치로 변경 */
            align-items: center;
            gap: 20px;
            background: rgba(40, 40, 40, 0.95);
            padding: 25px;
            border-radius: 20px;
            transition: opacity 0.8s ease;
            width: 80%; /* 모바일 가로폭 대응 */
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        #controls.hidden { opacity: 0; pointer-events: none; }

        /* 입력창 크기 확대 */
        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            background: #222;
            color: white;
            box-sizing: border-box;
        }

        .setting-group {
            display: flex;
            width: 100%;
            justify-content: space-around;
            align-items: center;
            font-size: 1.1rem;
        }

        /* 버튼 크기 확대 */
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: #e84118;
            color: white;
            font-weight: bold;
        }

        #display-container {
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        #scrolling-text {
            white-space: nowrap; font-weight: 900; line-height: 1;
            position: absolute;
        }

        @keyframes scrollAnim {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
        .animate { animation: scrollAnim 10s linear infinite; }
    </style>
</head>
<body class="show-cursor" onclick="showControls()">

    <div id="controls">
        <input type="text" id="userInput" placeholder="전광판 문구 입력" onfocus="showControls()">
        
        <div class="setting-group">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="scrollCheck" checked style="width: 20px; height: 20px;"> 스크롤
            </label>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>크기</span>
                <input type="range" id="sizeSlider" min="5" max="100" value="60">
            </div>
        </div>

        <div class="btn-group">
            <button onclick="runDisplay(event)">실행하기</button>
            <button onclick="toggleFullScreen(event)" style="background:#2f3640;">전체화면</button>
        </div>
    </div>

    <div id="display-container">
        <div id="scrolling-text">입력 후 실행하세요</div>
    </div>

    <script>
        const controls = document.getElementById('controls');
        const textElement = document.getElementById('scrolling-text');
        const body = document.body;
        let hideTimeout;

        function hideControls() {
            controls.classList.add('hidden');
            body.classList.remove('show-cursor');
        }

        function showControls() {
            controls.classList.remove('hidden');
            body.classList.add('show-cursor');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(hideControls, 4000); // 모바일은 조금 더 길게 유지
        }

        function runDisplay(e) {
            if(e) e.stopPropagation();
            const input = document.getElementById('userInput').value;
            if(!input) return;

            textElement.innerText = input;
            
            if (document.getElementById('scrollCheck').checked) {
                textElement.classList.add('animate');
                textElement.style.position = 'absolute';
            } else {
                textElement.classList.remove('animate');
                textElement.style.position = 'relative';
                textElement.style.transform = 'none';
            }
            
            textElement.style.fontSize = document.getElementById('sizeSlider').value + "vh";
            hideControls();
        }

        // 모바일 전체화면 강제 활성화 로직
        function toggleFullScreen(e) {
            if(e) e.stopPropagation();
            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const exitFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl).catch(err => {
                    alert(`전체화면 모드를 시작할 수 없습니다: ${err.message}`);
                });
            } else {
                exitFullScreen.call(doc);
            }
        }

        document.addEventListener('mousemove', showControls);
        document.addEventListener('touchstart', showControls); // 터치 대응

        document.addEventListener('keydown', (e) => {
            showControls();
            if (e.key === "Escape") {
                if (document.fullscreenElement) document.exitFullscreen();
            }
        });

        // 초기 실행
        showControls();
    </script>
</body>
</html>
