<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title"></title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9998326331328689"

<body>
    <div class="container">
        <div class="language-selector-container">
            <select id="language-selector">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
            </select>
        </div>
        <div id="start-page">
            <h1 id="main-title"></h1>
            <p id="start-description"></p>
            <button id="start-button"></button>
        </div>
        <div id="question-page" class="hidden">
            <div id="progress-indicator">
                <span class="progress-circle" id="circle-0"></span>
                <span class="progress-circle" id="circle-1"></span>
                <span class="progress-circle" id="circle-2"></span>
                <span class="progress-circle" id="circle-3"></span>
            </div>
            <div id="theme-title"></div>
            <div id="question-title"></div>
            <button class="answer-btn" id="answer-a"></button>
            <button class="answer-btn" id="answer-b"></button>
        </div>
        <div id="result-page" class="hidden">
            <h2 id="result-heading"></h2>
            <div id="result-mbti"></div>
            <div id="result-desc"></div>
            <button id="restart-button"></button>
        </div>
        <div id="ads">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9998326331328689"
     crossorigin="anonymous"></script>
<!-- ads -->

        </div>
    </div>
